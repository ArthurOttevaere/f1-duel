name: lock-race

on:
  schedule:
    # Hourly Fri-Sun (UTC): refresh the model entry post-quali, lock at race start.
    - cron: "15 * * * 5,6,0"
  workflow_dispatch:

concurrency:
  group: game-jobs
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: fastf1_cache
          key: fastf1-${{ github.run_id }}
          restore-keys: fastf1-
      - run: pip install -r requirements.txt
      - run: python jobs/lock_race.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
