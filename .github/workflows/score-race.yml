name: score-race

on:
  schedule:
    # Hourly Sun-Tue (UTC): score as soon as the official classification lands,
    # then re-score recent races so a late Driver-of-the-Day entry is applied.
    - cron: "45 * * * 0,1,2"
  workflow_dispatch:

concurrency:
  group: game-jobs
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Skip cleanly (green, no failure email) until the Supabase secrets exist.
      - name: Check configuration
        id: guard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase secrets not set — skipping score-race. Add SUPABASE_URL and SUPABASE_SERVICE_KEY in repo settings to enable it."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.configured == 'true'
        uses: actions/checkout@v4
      - if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.guard.outputs.configured == 'true'
        uses: actions/cache@v4
        with:
          path: fastf1_cache
          key: fastf1-${{ github.run_id }}
          restore-keys: fastf1-
      - if: steps.guard.outputs.configured == 'true'
        run: pip install -r requirements.txt
      - if: steps.guard.outputs.configured == 'true'
        run: python jobs/score_race.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Optional. Unset, every send is a logged no-op and the job is
          # otherwise unchanged — the reminders simply don't go out.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
