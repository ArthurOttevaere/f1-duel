name: sync-schedule

on:
  schedule:
    # Mondays 05:00 UTC: calendar, roster, season-pick metadata.
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: game-jobs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: fastf1_cache
          key: fastf1-${{ github.run_id }}
          restore-keys: fastf1-
      - run: pip install -r requirements.txt
      - run: python jobs/sync_schedule.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
